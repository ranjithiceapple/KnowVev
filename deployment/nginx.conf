upstream knowvec_backend {
    # Switch between versions by changing port
    server localhost:8007;  # V1 (change to 8008 for V2)
}

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://knowvec_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health checks
    location /v1/health {
        proxy_pass http://localhost:8007/health;
    }

    location /v2/health {
        proxy_pass http://localhost:8008/health;
    }
}
